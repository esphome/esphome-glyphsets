name: Release

# Publishes the distributions attached to the release to PyPI. Releases are
# immutable once published, so the Release Drafter workflow builds the package
# and attaches it to the draft; nothing is built here.

on:
  release:
    types:
      - published

permissions: {}

jobs:
  release:
    name: Publish package to PyPI
    runs-on: ubuntu-latest
    environment:
      name: release
      url: ${{ github.event.release.html_url }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download distributions from the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
          version="${TAG#v}"
          # Expect exactly one wheel and one sdist, both for this version.
          if [[ "$(find dist -type f | wc -l)" -ne 2 ]]; then
            echo "::error::Expected exactly one wheel and one sdist on the release"
            ls -l dist
            exit 1
          fi
          for f in dist/*; do
            case "$(basename "${f}")" in
              esphome_glyphsets-"${version}"-*.whl | esphome_glyphsets-"${version}".tar.gz) ;;
              *)
                echo "::error::${f} does not match version ${version}"
                exit 1
                ;;
            esac
          done

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
