name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - type: "pre-exclude"
    when:
      label: "nochangelog"
  - title: "Breaking Changes"
    semver-increment: "major"
    exclusive: true
    when:
      label: "breaking"
  - title: "Dependencies"
    semver-increment: "patch"
    collapse-after: 1
    exclusive: true
    when:
      labels:
        - "dependencies"
        - "github_actions"
  - title: "Other Changes"
  - type: "version-resolver"
    semver-increment: "minor"
    when:
      label: "enhancement"
  # Everything else is a patch release.
  - type: "version-resolver"
    semver-increment: "patch"

template: |
  > [!CAUTION]
  > **DO NOT PUBLISH THIS RELEASE YET!**
  > The package has not been built and attached. Wait for the Release Drafter
  > workflow to finish and this notice to be removed before publishing.
  <!-- ASSETS_PENDING -->

  ## What's Changed

  $CHANGES
