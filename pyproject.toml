[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools" ]

[project]
name = "esphome-glyphsets"
version = "0.2.0"
description = "A lightweight version of glyphsets for ESPHome"
readme = "README.md"
license = { text = "Apache Software License 2.0" }
authors = [
  { name = "ESPHome authors", email = "hello@openhomefoundation.org" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]

dependencies = [
]
urls."Bug Tracker" = "https://github.com/esphome/esphome-glyphsets/issues"
urls.Releases = "https://github.com/esphome/esphome-glyphsets/releases"
urls.repository = "https://github.com/esphome/esphome-glyphsets"

[dependency-groups]
dev = [
  "prek>=0.5.9",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff==0.15.22",
  "ty==0.0.96",
]

[tool.ruff]
target-version = "py312"
line-length = 88
lint.select = [
  "B",   # flake8-bugbear
  "D",   # flake8-docstrings
  "C4",  # flake8-comprehensions
  "S",   # flake8-bandit
  "F",   # pyflake
  "E",   # pycodestyle
  "W",   # pycodestyle
  "UP",  # pyupgrade
  "I",   # isort
  "RUF", # ruff specific
]
lint.ignore = [
  "D203", # 1 blank line required before class docstring
  "D212", # Multi-line docstring summary should start at the first line
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D107", # Missing docstring in `__init__`
  "D401", # First line of docstring should be in imperative mood
]
lint.per-file-ignores."conftest.py" = [ "D100" ]
lint.per-file-ignores."tests/**/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "S101",
]
lint.isort.known-first-party = [ "esphome_glyphsets", "tests" ]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.nam"]

[tool.pytest.ini_options]
addopts = """\
    -v
    -Wdefault
    --cov=esphome_glyphsets
    --cov-report=term
    --cov-report=xml
    """
pythonpath = [ "src" ]
testpaths = "tests/"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "@overload",
  "if TYPE_CHECKING",
  "raise NotImplementedError",
  'if __name__ == "__main__":',
]

[tool.ty.environment]
root = [ "src", "." ]
